name: Verify Disaster Assessor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disaster_assessor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py server.py app utils training tests
      - name: Check web app syntax
        run: for f in web/js/*.js web/js/views/*.js web/field/*.js web/share.js; do node --check "$f"; done
      - name: Docker image builds
        run: docker build -t dra-ci .
