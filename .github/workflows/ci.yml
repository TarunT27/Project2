name: Verify Disaster Assessor
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: disaster_assessor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libgl1 libglib2.0-0
      - run: pip install -r requirements-demo.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app.py utils tests
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: disaster_assessor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s browser_tests -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t disaster-review:check disaster_assessor
