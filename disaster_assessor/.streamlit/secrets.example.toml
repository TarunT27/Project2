# Copy to secrets.toml and fill values from your OIDC provider. Never commit it.
[auth]
redirect_uri = "https://YOUR_HOST/oauth2callback"
cookie_secret = "REPLACE_WITH_A_RANDOM_SECRET"
client_id = "YOUR_CLIENT_ID"
client_secret = "YOUR_CLIENT_SECRET"
server_metadata_url = "https://YOUR_PROVIDER/.well-known/openid-configuration"
