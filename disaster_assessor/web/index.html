<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rapid Disaster Assessment</title>
  <meta name="description" content="Assess post-disaster imagery, review damage, coordinate rescue crews and export situation reports.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M18 4 8 18h7l-2 10 11-15h-7z' fill='%23e9d25b'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="boot" class="boot"><div class="boot-mark">⚡</div><p>Loading…</p></div>

<section id="auth" class="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><span class="logo">DRA</span><span>Rapid Disaster Assessment</span></div>
    <h1 id="auth-title">Sign in</h1>
    <p class="muted" id="auth-sub">Use the account your coordinator created for you.</p>
    <form id="auth-form" class="stack" autocomplete="on">
      <label class="field" id="auth-name-row" hidden>Your name<input name="name" autocomplete="name" maxlength="100"></label>
      <label class="field">Username<input name="username" required minlength="2" maxlength="60" autocomplete="username" autocapitalize="none"></label>
      <label class="field">Password<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="form-error" id="auth-error" role="alert"></p>
      <button class="btn primary wide" type="submit" id="auth-submit">Sign in</button>
    </form>
    <p class="fine">Field crews: open <a href="/field/">the field app</a> on your phone.</p>
  </div>
</section>

<div class="app" id="app" hidden>
  <nav class="rail" aria-label="Primary">
    <a class="logo" href="#/incidents" title="Incidents">DRA</a>
    <div class="rail-group" id="nav-incident"></div>
    <div class="rail-group" id="nav-global"></div>
    <div class="rail-foot">
      <button class="avatar" id="user-btn" aria-label="Account"></button>
      <button class="rail-btn" id="logout" aria-label="Sign out" title="Sign out"></button>
    </div>
  </nav>
  <main class="main">
    <header class="topbar">
      <div class="crumbs">
        <span class="brand"><span class="bolt">⚡</span> Rapid Disaster Assessment</span>
        <span class="sep" id="crumb-sep" hidden>/</span>
        <label class="incident-switch" id="incident-switch" hidden>
          <span class="sr-only">Incident</span>
          <select id="incident-select"></select>
        </label>
      </div>
      <div class="top-right">
        <span class="live" id="live" title="Live updates"><span class="dot"></span><span id="live-text">Offline</span></span>
        <span class="status" id="status-chip" hidden><span class="dot"></span><span id="status-text"></span></span>
      </div>
    </header>
    <div id="view" class="view-host"></div>
  </main>
</div>

<input type="file" id="file-input" multiple hidden accept=".jpg,.jpeg,.png,.webp,.tif,.tiff,.mp4,.mov,.avi,.mkv,.srt">
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
